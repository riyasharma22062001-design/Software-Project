<!DOCTYPE html>
<html lang="en">
<head>      
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Ordering App</title>
    <style>        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        header { grid-column: 1 / -1; text-align: center; color: white; margin-bottom: 30px; }
        h1 { font-size: 2.5em; }
        .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .food-item { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: transform 0.3s; }
        .food-item:hover { transform: translateY(-10px); }
        .food-item img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; }
        .food-name { font-size: 1.5em; margin: 10px 0; color: #333; }
        .food-desc { color: #666; margin-bottom: 10px; }
        .food-price { font-size: 1.3em; color: #e74c3c; font-weight: bold; margin-bottom: 15px; }
        .add-btn { background: #27ae60; color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-size: 1em; transition: background 0.3s; width: 100%; }
.add-btn:hover { background: #219a52; }
        .auth-btn { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; margin: 0 5px; }
        .auth-btn:hover { background: #2980b9; }
        .cat-btn { background: #f39c12; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; margin: 0 5px; }
        .cat-btn.active { background: #e67e22; }
        .cat-btn:hover { background: #d68910; }
        .star { color: #f1c40f; }
        .search-controls { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; }
        #category-filters { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
        .reviews-list { max-height: 200px; overflow-y: auto; }
        .review { padding: 10px; border-bottom: 1px solid #eee; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 15% auto; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: #000; }
        .cart { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); height: fit-content; position: sticky; top: 20px; }
        .cart h2 { margin-bottom: 20px; color: #333; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .cart-item:last-child { border-bottom: none; }
        .qty-controls button { background: #3498db; color: white; border: none; width: 25px; height: 25px; border-radius: 50%; cursor: pointer; margin: 0 5px; }
        .total { font-size: 1.2em; font-weight: bold; margin-top: 20px; color: #27ae60; }
        .checkout-btn, .clear-btn { width: 100%; padding: 12px; border: none; border-radius: 25px; font-size: 1em; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
        .checkout-btn { background: #e74c3c; color: white; }
        .checkout-btn:hover { background: #c0392b; }
        .clear-btn { background: #95a5a6; color: white; }
        .clear-btn:hover { background: #7f8c8d; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } .cart { position: static; } }
        .animate-add { animation: bounce 0.5s; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } 60% { transform: translateY(-5px); } }
        .empty { text-align: center; color: #666; font-style: italic; }

        
        /* Horizontal Images Hero Section */
        .hero-images {
            display: flex;
            gap: 15px;
            padding: 20px 0;
            overflow-x: auto;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .hero-images::-webkit-scrollbar {
            height: 8px;
        }
        .hero-images::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .hero-images::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;    
        }
        .hero-img {
            flex: 0 0 280px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .hero-img:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }
        .hero-title {
            text-align: center;
            color: white;
            margin: 20px 0 10px;
            font-size: 1.5em;
        }
        @media (max-width: 768px) {
            .hero-img { flex: 0 0 250px; height: 180px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
<div id="auth-section" style="position: absolute; top: 20px; right: 20px;">
                <a href="login.html" id="login-link" class="auth-btn">Login</a>
                <a href="register.html" id="signup-link" class="auth-btn" style="display:none;">Sign Up</a>
                <button id="logout-btn" class="auth-btn" style="display:none;">Logout</button>
                <span id="user-info" style="margin-left:10px;"></span>
            </div>
            <h1>🍕 Delicious Food Ordering</h1>
            <p>Order your favorite meals online!</p>
        </header>
        <section>
            <div style="margin-bottom: 20px; text-align: center;">
                <input type="text" id="search-input" placeholder="Search by name or price..." style="padding:10px; width:300px; border-radius:25px; border:1px solid #ddd; margin-right:10px;">
                <input type="range" id="price-range" min="0" max="20" value="20" style="margin-right:10px;">
                <span id="price-value">$20</span>
            </div>
            <div id="category-filters" style="margin-bottom:20px; text-align:center;">
            </div>
            <h2 class="hero-title">🍔 Featured Deals</h2>
            <section class="hero-images" id="hero-images">
                <!-- Populated by JS -->
            </section>
            <section class="menu" id="menu">
                <!-- Food items will be populated by JS -->
            </section>
        </section>
        <section id="reviews-section" style="grid-column:1/-1; margin-top:50px; background:white; padding:30px; border-radius:15px;">
            <h2>⭐ Reviews & Ratings</h2>
            <div id="reviews-list">
                <p>No reviews yet. Be the first!</p>
            </div>
        </section>
        <aside class="cart">
            <h2>🛒 Your Cart</h2>
            <div id="cart-items">
                <div class="empty">Your cart is empty. Add some items!</div>
            </div>
            <div class="total" id="total">Total: $0.00</div>
            <button class="clear-btn" id="clear-cart" style="display:none;">Clear Cart</button>
            <button class="checkout-btn" id="checkout" style="display:none;">Checkout</button>
        </aside>
    </div>

    <!-- Reviews Modal for adding review -->
    <div id="review-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add Review</h2>
            <select id="review-food" style="width:100%; padding:10px; margin:10px 0;">
            </select>
            <input type="number" id="review-rating" min="1" max="5" step="0.1" placeholder="Rating (1-5)" style="width:100%; padding:10px; margin:10px 0;">
            <textarea id="review-text" placeholder="Your review..." style="width:100%; padding:10px; margin:10px 0; height:100px;"></textarea>
            <button id="submit-review" style="width:100%; padding:12px; background:#27ae60; color:white; border:none; border-radius:5px; cursor:pointer;">Submit Review</button>
        </div>
    </div>

            { id: 17, name: 'Combo Meal', category: 'Main Course', rating: 4.7, desc: 'Burger + Cola combo deal', price: 15.99, img: 'images/combo.jpg' }
        ];




        const categories = ['All', 'Starters', 'Main Course', 'Desserts', 'Drinks'];

        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        let currentFilter = 'All';
        let searchTerm = '';
        let maxPrice = 20;

        document.getElementById('price-range').addEventListener('input', (e) => {
            maxPrice = e.target.value;
            document.getElementById('price-value').textContent = `$${maxPrice}`;
            filterMenu();
        });

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchTerm = e.target.value.toLowerCase();
            filterMenu();
        });

        function renderCategoryFilters() {
            const filters = document.getElementById('category-filters');
            filters.innerHTML = categories.map(cat => `<button class="cat-btn" onclick="setCategory('${cat}')">${cat}</button>`).join('');
        }

        function setCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            filterMenu();
        }

        function filterMenu() {
            const filteredFoods = foods.filter(food => 
                food.category === currentFilter || currentFilter === 'All' &&
                food.name.toLowerCase().includes(searchTerm) &&
                food.price <= maxPrice
            );
            const menu = document.getElementById('menu');
            menu.innerHTML = filteredFoods.map(food => `
                <div class="food-item">
                    <img src="${food.img}" alt="${food.name}">
                    <div style="display:flex; align-items:center; margin:10px 0;">
                        <span class="star">${'★'.repeat(Math.floor(food.rating))}${food.rating % 1 !== 0 ? '☆' : ''}</span>
                        <span style="margin-left:auto;">(${food.rating})</span>
                    </div>
                    <h3 class="food-name">${food.name}</h3>
                    <p class="food-desc">${food.desc}</p>
                    <p class="food-price">$${food.price.toFixed(2)}</p>
                    <button class="add-btn" onclick="addToCart(${food.id})">Add to Cart</button>
                </div>
            `).join('');
        }

        function renderHero() {
            const featuredIds = [4, 10, 17];
            const heroContainer = document.getElementById('hero-images');
            heroContainer.innerHTML = featuredIds.map(id => {
                const food = foods.find(f => f.id === id);
                if (food) {
                    return `<img src="${food.img}" alt="${food.name}" class="hero-img" onclick="addToCart(${id})" title="Add ${food.name} to cart - $${food.price}">`;
                }
                return '';
            }).join('');
        }

        function renderMenu() {
            filterMenu();
        }


        function addToCart(id) {
            const food = foods.find(f => f.id === id);
            const cartItem = cart.find(item => item.id === id);
            if (cartItem) {
                cartItem.qty++;
            } else {
                cart.push({ ...food, qty: 1 });
            }
            updateCart();
            const btn = event.target;
            btn.classList.add('animate-add');
            setTimeout(() => btn.classList.remove('animate-add'), 500);
        }

        function updateCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            const cartItems = document.getElementById('cart-items');
            const totalEl = document.getElementById('total');
            const clearBtn = document.getElementById('clear-cart');
            const checkoutBtn = document.getElementById('checkout');

            if (cart.length === 0) {
                cartItems.innerHTML = '<div class="empty">Your cart is empty. Add some items!</div>';
                clearBtn.style.display = 'none';
                checkoutBtn.style.display = 'none';
                totalEl.textContent = 'Total: $0.00';
                return;
            }
            cartItems.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <span>${item.name}</span>
                    <div>
                        <button onclick="changeQty(${item.id}, -1)">-</button>
                        <span>${item.qty}</span>
                        <button onclick="changeQty(${item.id}, 1)">+</button>
                        <span style="margin-left:10px;font-weight:bold;">$${(item.price * item.qty).toFixed(2)}</span>
                    </div>
                </div>
            `).join('');

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const tax = subtotal * 0.1;
            const total = subtotal + tax;
            totalEl.innerHTML = `Subtotal: $${subtotal.toFixed(2)}<br>Tax (10%): $${tax.toFixed(2)}<br><strong>Total: $${total.toFixed(2)}</strong>`;

            clearBtn.style.display = 'block';
            checkoutBtn.style.display = 'block';
        }

        function changeQty(id, delta) {
            const item = cart.find(item => item.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
                updateCart();
            }
        }

        function clearCart() {
            cart = [];
            updateCart();
        }

        function checkout() {
            if (cart.length === 0) return alert('Cart is empty!');
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0) * 1.1;
            alert(`Thank you for your order! Total: $${total.toFixed(2)}\nOrder details: ${cart.map(item => `${item.name} x${item.qty}`).join(', ')}`);
            cart = [];
            updateCart();
        }

        // Event listeners
        document.getElementById('clear-cart').addEventListener('click', clearCart);
        document.getElementById('checkout').addEventListener('click', checkout);

        // Auth logic
        let currentUser = localStorage.getItem('currentUser') || null;

        function updateAuthUI() {
            const userInfo = document.getElementById('user-info');
            if (currentUser) {
                userInfo.textContent = `Welcome, ${currentUser}!`;
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('signup-btn').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'inline-block';
            } else {
                userInfo.textContent = '';
                document.getElementById('login-btn').style.display = 'inline-block';
                document.getElementById('signup-btn').style.display = 'inline-block';
                document.getElementById('logout-btn').style.display = 'none';
            }
        }

        // Links handled by href

        document.getElementById('logout-btn').addEventListener('click', () => {
            currentUser = null;
            localStorage.removeItem('currentUser');
            updateAuthUI();
        });



        // Reviews logic
        let reviews = JSON.parse(localStorage.getItem('reviews')) || [];
        document.getElementById('reviews-section').innerHTML += '<button onclick="openReviewModal()" style="margin-top:20px; padding:10px 20px; background:#9b59b6; color:white; border:none; border-radius:5px; cursor:pointer;">Add Review</button>';

        function openReviewModal() {
            if (!currentUser) {
                alert('Please login to add review');
                return;
            }
            const select = document.getElementById('review-food');
            select.innerHTML = foods.map(food => `<option value="${food.id}">${food.name}</option>`).join('');
            document.getElementById('review-modal').style.display = 'block';
        }

        document.querySelectorAll('.close').forEach(close => close.addEventListener('click', () => {
            document.querySelectorAll('.modal').forEach(modal => modal.style.display = 'none');
        }));

        document.getElementById('submit-review').addEventListener('click', () => {
            const foodId = parseInt(document.getElementById('review-food').value);
            const rating = parseFloat(document.getElementById('review-rating').value);
            const text = document.getElementById('review-text').value;
            if (foodId && rating && text && currentUser) {
                reviews.push({ foodId, rating, text, user: currentUser, date: new Date().toLocaleDateString() });
                localStorage.setItem('reviews', JSON.stringify(reviews));
                renderReviews();
                document.getElementById('review-modal').style.display = 'none';
                document.getElementById('review-rating').value = '';
                document.getElementById('review-text').value = '';
            }
        });

        function renderReviews() {
            const list = document.getElementById('reviews-list');
            if (reviews.length === 0) {
                list.innerHTML = '<p>No reviews yet. Be the first!</p>';
                return;
            }
            list.innerHTML = reviews.map(review => {
                const food = foods.find(f => f.id === review.foodId);
                return `<div class="review">
                    <strong>${food ? food.name : 'Unknown'}</strong> - ${review.user} (${review.date})
                    <div>${'★'.repeat(Math.floor(review.rating))}${review.rating % 1 !== 0 ? '☆' : ''} (${review.rating})
                    <p>${review.text}</p>
                </div>`;
            }).join('');
            list.classList.add('reviews-list');
        }

        // Init
        renderCategoryFilters();
        updateAuthUI();
        renderReviews();
        renderHero();
        renderMenu();
        updateCart();
    </script>

</body>
</html>
